# Day 1 afternoon — Policy 2: no :latest tag.
# Apply: kubectl apply -f policies/block-latest.yaml
# Scoped to namespace paynest only.
# Kyverno v1.20 format: ValidatingPolicy (CEL). PROVEN on 2026-11-26:
# kubectl apply -f test-latest.yaml was denied with
# "Images must not use the :latest tag. Use a fixed version tag."
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: block-latest-tag
spec:
  validationActions:
    - Deny
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [paynest, paynest-demo]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - message: "Images must not use the :latest tag. Use a fixed version tag."
      expression: >-
        object.spec.containers.all(c, c.image.contains(':') && !c.image.endsWith(':latest'))
    - message: "Init container images must not use the :latest tag."
      expression: >-
        !has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.contains(':') && !c.image.endsWith(':latest'))
