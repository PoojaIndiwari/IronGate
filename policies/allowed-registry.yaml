# Day 1 afternoon — Policy 4: only images from the contract registry run.
# Apply: kubectl apply -f policies/allowed-registry.yaml
# Scoped to namespace paynest only.
# Kyverno v1.20 format: ValidatingPolicy (CEL).
# BEFORE you apply this, replace YOUR-REGISTRY with the registry
# from SIGNING-CONTRACT.md (example: 123456789.dkr.ecr.eu-west-1.amazonaws.com).
# Until you replace it, only paynest:* images pass — that is the
# laptop-test allowance below. Remove the paynest:* part for the
# final demo, so ONLY the contract registry is allowed.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: allowed-registry-only
spec:
  validationActions:
    - Deny
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: paynest
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - message: "Images must come from the registry in the signing contract."
      expression: >-
        object.spec.containers.all(c, c.image.startsWith("YOUR-REGISTRY/") || c.image.startsWith("paynest:"))
    - message: "Init container images must come from the registry in the signing contract."
      expression: >-
        !has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.startsWith("YOUR-REGISTRY/") || c.image.startsWith("paynest:"))
