# Day 1 afternoon — Policy 1: only signed images run in paynest.
# DO NOT APPLY THIS YET. Read this whole file first.
# Kyverno v1.20 format: ImageValidatingPolicy (CEL).
# Scoped to namespace paynest only, so Kyverno/Falco system pods keep running.
#
# BEFORE you apply this, do ALL of these:
#   1. Generate a Cosign key pair (cosign generate-key-pair) and
#      sign your test image, OR get the public key from Person A.
#      Replace YOUR-REGISTRY below with the registry from
#      SIGNING-CONTRACT.md (for the laptop test, the registry you
#      push paynest:test1 to).
#   2. Replace PASTE-THE-WHOLE-CONTENTS-OF-cosign.pub-HERE below
#      with the whole contents of cosign.pub
#      (the PUBLIC key only — never put cosign.key, the private
#      key, in this repo or in this file).
#   3. Push and sign the exact image name + tag you will deploy.
#      An unsigned image, or a signature for a different tag, will
#      be blocked — that is Scenario 2, and it is the point.
# If you apply this file with the placeholders still in it, every
# paynest pod will be blocked, including your good test image.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signature
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: paynest
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "YOUR-REGISTRY/paynest:*"
    - glob: "paynest:*"
  attestors:
    - name: cosign
      cosign:
        key:
          data: |-
            -----BEGIN PUBLIC KEY-----
            PASTE-THE-WHOLE-CONTENTS-OF-cosign.pub-HERE
            -----END PUBLIC KEY-----
  validations:
    - message: "Image must be signed with the Cosign key in the signing contract."
      expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.cosign])).all(e, e > 0)
