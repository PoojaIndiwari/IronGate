# Automated event-driven response rules for Falco Talon (Section 5.5).
# Triggers automatically when CRITICAL PayNest Falco rules fire in paynest or paynest-demo.
# STATUS: NOT TESTED LIVE. Falco Talon is not deployed in the kind cluster, so these rules
# have never fired. The only proven containment is the manual .\response\respond.ps1.
# Do not describe containment as automated until a live Talon run is recorded.
# Local laptop alternative (when Falco Talon is not deployed): .\response\respond.ps1

- action: Label pod as quarantined
  actionner: kubernetes:label
  parameters:
    labels:
      quarantine: "true"
      app: ""
      irongate.io/network: ""

- action: Isolate pod with NetworkPolicy
  actionner: kubernetes:networkpolicy
  parameters:
    allow: []

- action: Terminate compromised pod
  actionner: kubernetes:terminate
  parameters:
    ignoreDaemonsets: true
    ignoreStatefulsets: false
    gracePeriodSeconds: 0

- rule: Quarantine and terminate pod on IMDS access (Scenario 3)
  match:
    rules:
      - Paynest Contact IMDS
    output_fields:
      - k8s.ns.name=paynest
      - k8s.ns.name=paynest-demo
  actions:
    - action: Label pod as quarantined
    - action: Isolate pod with NetworkPolicy
    - action: Terminate compromised pod

- rule: Quarantine and terminate pod on Crypto Miner or Container Escape
  match:
    rules:
      - Paynest Crypto Miner Signs
      - Paynest Container Escape Attempt
    output_fields:
      - k8s.ns.name=paynest
      - k8s.ns.name=paynest-demo
  actions:
    - action: Label pod as quarantined
    - action: Isolate pod with NetworkPolicy
    - action: Terminate compromised pod
