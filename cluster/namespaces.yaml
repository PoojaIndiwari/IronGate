# Day 1 morning — cluster baseline.
# Apply: kubectl apply -f cluster/namespaces.yaml
# paynest gets Pod Security "restricted". security / monitoring do NOT —
# Kyverno and Falco need privileges to run, so do not restrict those two.
apiVersion: v1
kind: Namespace
metadata:
  name: paynest
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: security
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
