# Day 1 evening — 6 custom Falco rules for PayNest.
# Uses the macros that ship with Falco's default rules
# (spawned_process, container, shell_procs, open_write, open_read).
# Load it through Helm, not with kubectl apply:
#   helm upgrade falco falcosecurity/falco -n security \
#     --set-file customRules.paynest-rules\\.yaml=falco/custom-rules.yaml
#   (or paste this file under customRules: in your Falco values file)
# Then restart / check: kubectl logs -n security -l app.kubernetes.io/name=falco
# If Falco reports a macro it does not know, your Falco version's
# default rules differ — check the rule name in the log and tell Muse.
- list: paynest_namespaces
  items: [paynest, attack-test]

- rule: Paynest Shell in Container
  desc: A shell was opened inside a PayNest pod (Execution, MITRE T1059)
  condition: >
    spawned_process and container
    and proc.name in (shell_binaries)
    and proc.tty != 0
    and k8s.ns.name in (paynest_namespaces)
  output: >
    Shell in PayNest pod (user=%user.name ns=%k8s.ns.name pod=%k8s.pod.name
    shell=%proc.name parent=%proc.pname cmdline=%proc.cmdline)
  priority: WARNING
  tags: [container, shell, mitre_execution, T1059]

- rule: Paynest Contact IMDS
  desc: A pod connected to the cloud metadata address 169.254.169.254 — Scenario 3 (Credential Access, MITRE T1552)
  condition: >
    evt.type = connect and container
    and fd.rip = "169.254.169.254"
    and k8s.ns.name in (paynest_namespaces)
  output: >
    Connection to IMDS 169.254.169.254 (user=%user.name ns=%k8s.ns.name
    pod=%k8s.pod.name cmdline=%proc.cmdline ip=%fd.rip port=%fd.rport)
  priority: CRITICAL
  tags: [container, network, mitre_credential_access, T1552]

- rule: Paynest Write to System Folders
  desc: A process wrote to /etc, /root or a binary folder (Persistence, MITRE T1543)
  condition: >
    open_write and container
    and (fd.name startswith /etc or fd.name startswith /root
    or fd.name startswith /usr/bin or fd.name startswith /usr/sbin)
    and k8s.ns.name in (paynest_namespaces)
  output: >
    Write to system folder (user=%user.name ns=%k8s.ns.name pod=%k8s.pod.name
    file=%fd.name cmdline=%proc.cmdline)
  priority: WARNING
  tags: [container, filesystem, mitre_persistence, T1543]

- rule: Paynest Crypto Miner Signs
  desc: A miner process ran, or a pod connected to a common mining-pool port (Impact, MITRE T1496)
  condition: >
    container and k8s.ns.name in (paynest_namespaces)
    and ((spawned_process and proc.name in (xmrig, minerd, cpuminer))
    or (evt.type = connect and fd.rport in (3333, 4444, 5555, 7777, 14444)))
  output: >
    Possible crypto miner (user=%user.name ns=%k8s.ns.name pod=%k8s.pod.name
    proc=%proc.name cmdline=%proc.cmdline port=%fd.rport)
  priority: CRITICAL
  tags: [container, network, mitre_impact, T1496]

- rule: Paynest Read Service Account Token
  desc: A process read the pod service-account token (Credential Access, MITRE T1552)
  condition: >
    open_read and container
    and fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount
    and k8s.ns.name in (paynest_namespaces)
  output: >
    Service account token read (user=%user.name ns=%k8s.ns.name pod=%k8s.pod.name
    file=%fd.name cmdline=%proc.cmdline)
  priority: WARNING
  tags: [container, filesystem, mitre_credential_access, T1552]

- rule: Paynest Container Escape Attempt
  desc: A process tried to break out of a container — nsenter/unshare, or reading /proc/1/root (Privilege Escalation, MITRE T1611)
  condition: >
    container and k8s.ns.name in (paynest_namespaces)
    and ((spawned_process and proc.name in (nsenter, unshare))
    or (open_read and fd.name startswith /proc/1/root)
    or (spawned_process and proc.cmdline contains "nsenter"))
  output: >
    Possible container escape attempt (user=%user.name ns=%k8s.ns.name pod=%k8s.pod.name
    proc=%proc.name cmdline=%proc.cmdline file=%fd.name)
  priority: CRITICAL
  tags: [container, mitre_privilege_escalation, T1611]
