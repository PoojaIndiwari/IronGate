# Person B runtime checks — IronGate
# Runs on every push / pull request that touches the runtime half, and
# on demand. No secrets, no registry access, no AWS.
# It validates detection-as-code rules and proves, on a fresh kind cluster,
# that Kyverno rejects bad pods and admits a compliant pod.
name: person-b-runtime

on:
  push:
    paths:
      - "policies/**"
      - "cluster/**"
      - "networkpolicies/**"
      - "falco/**"
      - "runtime/**"
      - ".github/workflows/person-b-runtime.yml"
  pull_request:
    paths:
      - "policies/**"
      - "cluster/**"
      - "networkpolicies/**"
      - "falco/**"
      - "runtime/**"
      - ".github/workflows/person-b-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detection-as-code:
    name: Detection-as-code rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Replay Kubernetes audit detection fixtures
        run: python3 runtime/audit.py

      - name: Validate and replay Falco custom rules
        run: python3 runtime/test_falco_rules.py

  runtime-checks:
    name: Admission control checks in kind
    needs: detection-as-code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kind
        run: |
          curl -fsSL -o ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          curl -fsSLO "https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v4.3.2-linux-amd64.tar.gz -o helm.tar.gz
          tar -zxf helm.tar.gz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          rm -rf helm.tar.gz linux-amd64
          helm version

      - name: Create kind cluster
        run: |
          kind create cluster --name irongate --wait 120s
          kubectl cluster-info
          kubectl get nodes

      - name: Apply namespaces and NetworkPolicies
        run: |
          kubectl apply -f cluster/namespaces.yaml
          kubectl apply -f networkpolicies/default-deny.yaml
          kubectl apply -f networkpolicies/allow-paynest.yaml
          kubectl apply -f networkpolicies/allow-frontend-egress.yaml

      - name: Install Kyverno
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          helm install kyverno kyverno/kyverno -n security --create-namespace --wait --timeout 5m
          kubectl get pods -n security
          kubectl get validatingpolicies

      - name: Apply Person B policies
        run: |
          kubectl apply -f policies/block-latest.yaml
          kubectl apply -f policies/block-privileged.yaml
          sleep 20
          kubectl get validatingpolicies

      - name: Check 1 — nginx:latest must be denied
        run: |
          cat <<'EOF' > /tmp/test-latest.yaml
          apiVersion: v1
          kind: Pod
          metadata:
            name: test-latest
            namespace: paynest
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: test
                image: nginx:latest
                securityContext:
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  capabilities:
                    drop: ["ALL"]
          EOF
          if kubectl apply -f /tmp/test-latest.yaml; then
            echo "::error::FAIL: nginx:latest was admitted, block-latest did not deny it"
            exit 1
          else
            echo "PASS: nginx:latest was denied as expected"
          fi

      - name: Check 2 — privileged pod must be denied
        run: |
          cat <<'EOF' > /tmp/test-privileged.yaml
          apiVersion: v1
          kind: Pod
          metadata:
            name: test-privileged
            namespace: paynest
          spec:
            containers:
              - name: test
                image: nginxinc/nginx-unprivileged:1.27-alpine
                securityContext:
                  privileged: true
                  allowPrivilegeEscalation: true
          EOF
          if kubectl apply -f /tmp/test-privileged.yaml; then
            echo "::error::FAIL: privileged pod was admitted"
            exit 1
          else
            echo "PASS: privileged pod was denied as expected"
          fi

      - name: Check 3 — a good pod must be created and run
        run: |
          cat <<'EOF' > /tmp/test-good.yaml
          apiVersion: v1
          kind: Pod
          metadata:
            name: test-good
            namespace: paynest
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: test
                image: nginxinc/nginx-unprivileged:1.27-alpine
                securityContext:
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  capabilities:
                    drop: ["ALL"]
          EOF
          kubectl apply -f /tmp/test-good.yaml
          kubectl wait --for=condition=Ready pod/test-good -n paynest --timeout 120s
          kubectl get pod test-good -n paynest
          echo "PASS: good pod runs"

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name irongate || true
