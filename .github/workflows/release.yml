name: IronGate CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    name: Run IronGate CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pr-checks.yml
    permissions:
      contents: read

  build:
    name: Build and push PayNest candidate
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.publish.outputs.image }}
      base: ${{ steps.publish.outputs.base }}

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build and push to GitHub Container Registry
        id: publish
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          base=$(awk '$1 == "FROM" {print $2; exit}' Dockerfile)

          if [[ ! "$base" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "The Dockerfile must pin its base image to a SHA-256 digest."
            exit 1
          fi

          printf '%s' "$REGISTRY_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          docker buildx create --driver docker-container --use --bootstrap
          epoch=$(git log -1 --format=%ct)

          docker buildx build \
            --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=$epoch" \
            --provenance=false \
            --output "type=image,name=$repo:$GITHUB_SHA,push=true,rewrite-timestamp=true" \
            --metadata-file "$RUNNER_TEMP/build.json" \
            .

          digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          echo "image=$repo@$digest" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Candidate image: \`$repo@$digest\`" >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Trivy image security gate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.76.2
          cache: false

      - name: Scan the exact candidate digest
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$IMAGE"

  sign:
    name: Create SBOM, record provenance and sign
    needs: [build, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      IMAGE: ${{ needs.build.outputs.image }}
      BASE_IMAGE: ${{ needs.build.outputs.base }}

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56
        with:
          syft-version: v1.57.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab
        with:
          cosign-release: v3.1.5

      - name: Generate the SBOM and provenance
        run: |
          set -euo pipefail
          syft "registry:$IMAGE" -o "spdx-json=$RUNNER_TEMP/sbom.json"
          python3 examples/build_provenance.py > "$RUNNER_TEMP/provenance.json"

      - name: Sign the image and attach both signed attestations
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE"

          cosign attest --yes \
            --type slsaprovenance1 \
            --predicate "$RUNNER_TEMP/provenance.json" \
            "$IMAGE"

          cosign attest --yes \
            --type spdxjson \
            --predicate "$RUNNER_TEMP/sbom.json" \
            "$IMAGE"

      - name: Verify the release and print Person B's handoff
        run: |
          set -euo pipefail
          signer="https://github.com/$GITHUB_WORKFLOW_REF"
          bash examples/verify.sh "$IMAGE" "$signer"

          {
            echo "### Verified IronGate release"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image: \`$IMAGE\`"
            echo "- Signer: \`$signer\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy the verified digest to PayNest
    needs: [build, sign]
    if: vars.ENABLE_PAYNEST_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: paynest-demo
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Render the workload and wait for rollout
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          KUBECONFIG_B64: ${{ secrets.PAYNEST_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/payn​est-kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          printf '%s' "${KUBECONFIG_B64:?Missing deployment credential}" |
            base64 --decode > "$KUBECONFIG"

          python3 examples/render_demo.py "$GITHUB_REPOSITORY" "$IMAGE"
          kubectl apply --namespace paynest-demo -f local-output/release.yaml
          kubectl rollout status deployment/paynest \
            --namespace paynest-demo --timeout=180s