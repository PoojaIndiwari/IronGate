# Nightly runtime posture & detection coverage check — IronGate Person B
# Runs on a nightly schedule (02:00 UTC) and on demand.
# Validates detection-as-code fixtures, runs a Kubescape posture scan on
# Kubernetes manifests, and publishes a coverage summary.
name: person-b-nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-coverage-and-posture:
    name: Nightly detection coverage & posture scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run detection-as-code suites
        id: detections
        run: |
          set -euo pipefail
          python3 runtime/audit.py | tee audit-results.txt
          python3 runtime/test_falco_rules.py | tee falco-results.txt

      - name: Install Kubescape (pinned release, checksum-verified)
        env:
          KUBESCAPE_VERSION: v3.0.41
        run: |
          set -euo pipefail
          # Pinned release + checksum file instead of piping an install script from master.
          base="https://github.com/kubescape/kubescape/releases/download/${KUBESCAPE_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/kubescape.tar.gz" "$base/kubescape-ubuntu-latest.tar.gz"
          curl -fsSL -o "$tmp/checksums.sha256" "$base/checksums.sha256"
          expected="$(grep -E ' \*?kubescape-ubuntu-latest\.tar\.gz$' "$tmp/checksums.sha256" | cut -d' ' -f1)"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::No checksum entry for kubescape-ubuntu-latest.tar.gz"; exit 1; }
          echo "$expected  $tmp/kubescape.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/kubescape.tar.gz" -C "$tmp"
          bin="$(find "$tmp" -type f -name 'kubescape*' ! -name '*.tar.gz' ! -name '*.sha256' | head -1)"
          sudo install -m 0755 "$bin" /usr/local/bin/kubescape
          kubescape version

      - name: Run Kubescape posture scan on manifests
        run: |
          # Report-only on purpose: the table below is evidence, not a gate.
          kubescape scan k8s/ networkpolicies/ cluster/ --format pretty-printer || true

      - name: Publish nightly coverage summary
        if: always()
        run: |
          {
            echo "## IronGate Person B — Nightly Detection & Posture Report"
            echo ""
            echo "### Kubernetes Audit Detection Replay"
            echo '```'
            cat audit-results.txt 2>/dev/null || echo "No audit output"
            echo '```'
            echo ""
            echo "### Falco Rule Validation & Replay (6 MITRE ATT&CK Rules)"
            echo '```'
            cat falco-results.txt 2>/dev/null || echo "No Falco output"
            echo '```'
            echo ""
            echo "Note: Prowler cloud posture checks are skipped in the laptop/CI-only build (no AWS account)."
          } >> "$GITHUB_STEP_SUMMARY"
